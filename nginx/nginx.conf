    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #     add_header X-Frame-Options "SAMEORIGIN" always;
    #     add_header X-Content-Type-Options "nosniff" always;
    #     add_header X-XSS-Protection "1; mode=block" always;
    #     add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    #
    #     server_tokens off;
    # }

    # ============================================
    # Application principale: www.monapp.fr
    # ============================================
    server {
        listen 80;
        listen [::]:80;
        server_name www.monapp.fr monapp.fr localhost;

        # Redirection vers HTTPS (en production)
        # return 301 https://$server_name$request_uri;

        # En développement, on peut garder HTTP
        location / {
            # Reverse proxy vers webapp2
            proxy_pass https://webapp_backend;

            # Headers nécessaires
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # SSL verification (car webapp2 utilise HTTPS)
            proxy_ssl_verify off;
        }

        # API endpoints avec rate limiting
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass https://webapp_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_ssl_verify off;
        }

        # Headers de sécurité
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        server_tokens off;
    }

